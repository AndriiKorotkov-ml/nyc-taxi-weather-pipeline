version: 2
models:
  - name: silver_weather_hourly
    config:
      materialized: table
      schema: silver
    columns:
      - name: weather_hour
        data_tests:
          - not_null
          - unique
      - name: temperature
        data_tests:
          - not_null
      - name: precipitation
        data_tests:
          - not_null
          - generic_non_negative
      - name: weather_code
        data_tests: 
          - not_null
          - accepted_values:
                arguments:
                  values: [0, 1, 2, 3, 45, 48, 51, 53, 55, 56, 57, 61, 63, 65, 66, 67,71, 73, 75, 77, 80, 81, 82, 85, 86, 95, 96, 97, 99]

