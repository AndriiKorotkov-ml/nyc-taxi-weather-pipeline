version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andrii" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.113",
    "dbt-core>=1.12.5",
    "dbt-databricks>=1.12.7",
    "python-dotenv>=0.9.9",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
